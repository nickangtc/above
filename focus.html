<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Above — Focus session</title>
  <style>
    :root {
      --bg: #f4f2ec;
      --ink: #1e221f;
      --ink-muted: #5a615c;
      --accent: #2c4c3f;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(640px 360px at 50% 38%, #e9ece4 0%, transparent 72%),
        var(--bg);
      color: var(--ink);
      font: 16px/1.6 var(--font-sans);
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 32rem;
      padding: 2.5rem 2rem;
    }
    .mark {
      display: block;
      width: 52px;
      height: 52px;
      margin: 0 auto 1.5rem;
      color: var(--accent);
    }
    .eyebrow {
      display: block;
      margin-bottom: 0.75rem;
      color: var(--accent);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 0.75rem;
      font: 400 clamp(1.9rem, 5vw, 2.6rem)/1.18 var(--font-serif);
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--ink-muted);
      font-size: 15.5px;
    }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 52 52" fill="none" aria-hidden="true">
      <circle cx="26" cy="26" r="24" stroke="currentColor" stroke-width="1" opacity=".22"/>
      <circle cx="26" cy="26" r="16" stroke="currentColor" stroke-width="1" opacity=".42"/>
      <circle cx="26" cy="26" r="4" fill="currentColor" opacity=".85"/>
    </svg>
    <span class="eyebrow">Above · Focus session</span>
    <h1>You chose to focus.</h1>
    <p>This site is set aside for now. Take a breath and return to what matters.</p>
  </main>
</body>
</html>
